<!-- Bootstrap Bundle con Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
	const form = document.getElementById('kt_sign_in_form');
	const submitButton = document.getElementById('kt_sign_in_submit');
	const indicatorLabel = submitButton ? submitButton.querySelector('.indicator-label') : null;
	const indicatorProgress = submitButton ? submitButton.querySelector('.indicator-progress') : null;

	const countrySelect = document.getElementById('countrySelectorForm');
	const companyCodeInput = document.getElementById('companyCodeInput');

	const passwordInput = document.getElementById('kt_password');
	const visibilityToggle = document.getElementById('kt_password_visibility');
	const userInput = document.getElementById('kt_user');
	const rememberMeCheckbox = document.getElementById('kt_remember_me');

	// Compañía fija: Nauffar (PP)
	const FIXED_COMPANY = 'PP';
	const COMPANY_SUBTITLE = 'Procesadora Industrial de Plasticos';

	let countryList = [];

	initializeTooltip();
	initializePasswordToggle();
	initializeSessionStateNotice();
	loadCredentials();
	initializeCatalog();
	initializeFormSubmission();

	/**
	 * Guardar credenciales: username y password en cookies HttpOnly (backend)
	 * Solo guardar estado de "remember me" en localStorage
	 * El backend maneja el guardado de username y password en cookies HttpOnly cuando rememberMe está marcado
	 */
	function saveCredentials() {
		if (!rememberMeCheckbox) {
			return;
		}

		if (rememberMeCheckbox.checked) {
			// Solo guardar el estado de "remember me" en localStorage
			// Las credenciales (username y password) se guardan en cookies HttpOnly por el backend
			localStorage.setItem('rememberMe', 'true');
		} else {
			// Eliminar estado de "remember me" si se desmarca
			// Las cookies se eliminan automáticamente por el backend
			localStorage.removeItem('rememberMe');
		}
	}

	/**
	 * Cargar credenciales: username y password desde cookies HttpOnly
	 * Solo el estado de "remember me" se carga desde localStorage
	 */
	async function loadCredentials() {
		if (!userInput || !passwordInput || !rememberMeCheckbox) {
			return;
		}

		// Verificar localStorage para el estado de rememberMe
		const rememberMe = localStorage.getItem('rememberMe') === 'true';
		
		if (!rememberMe) {
			rememberMeCheckbox.checked = false;
			return;
		}

		// Si rememberMe está activo, cargar desde cookies HttpOnly
		rememberMeCheckbox.checked = true;

		try {
			// Obtener username y password desde cookies HttpOnly
			const endpointUrl = 'Login/get_remembered_username.php';
			
			const response = await fetch(endpointUrl, {
				method: 'GET',
				headers: {
					'Accept': 'application/json'
				},
				credentials: 'include' // Importante: incluir cookies HttpOnly
			});

			if (!response.ok) {
				return;
			}

			const data = await response.json();

			if (data.success && data.hasRememberMe) {
				// Cargar username desde cookie HttpOnly
				if (data.username) {
					userInput.value = data.username;
				}
				
				// Cargar password desde cookie HttpOnly
				if (data.password) {
					passwordInput.value = data.password;
				}
			} else {
				rememberMeCheckbox.checked = false;
			}
		} catch (error) {
			rememberMeCheckbox.checked = false;
		}
	}

	function saveLastCountry() {
		if (!countrySelect || !countrySelect.value) {
			return;
		}

		localStorage.setItem('lastSelectedCountry', countrySelect.value);
	}

	function loadLastCountry() {
		if (!countrySelect || !countryList.length) {
			return;
		}

		const lastCountry = localStorage.getItem('lastSelectedCountry');
		if (!lastCountry) {
			return;
		}

		for (let i = 0; i < countrySelect.options.length; i++) {
			const option = countrySelect.options[i];
			if (option.value === lastCountry) {
				countrySelect.value = lastCountry;
				applySelectedCountry();
				return;
			}
		}
	}

	function initializeTooltip() {
		if (!visibilityToggle) {
			return;
		}

		new bootstrap.Tooltip(visibilityToggle, {
			title: 'Mostrar contraseña',
			placement: 'top'
		});
	}

	function initializePasswordToggle() {
		if (!passwordInput || !visibilityToggle) {
			return;
		}

		visibilityToggle.setAttribute('data-bs-title', 'Mostrar contraseña');

		visibilityToggle.addEventListener('click', function () {
			const isHidden = passwordInput.type === 'password';
			passwordInput.type = isHidden ? 'text' : 'password';

			const icon = visibilityToggle.querySelector('i');
			if (icon) {
				icon.classList.remove(isHidden ? 'ki-eye' : 'ki-eye-slash');
				icon.classList.add(isHidden ? 'ki-eye-slash' : 'ki-eye');
			}

			const tooltipText = isHidden ? 'Ocultar contraseña' : 'Mostrar contraseña';
			visibilityToggle.setAttribute('data-bs-title', tooltipText);

			const tooltip = bootstrap.Tooltip.getInstance(visibilityToggle);
			if (tooltip) {
				tooltip.setContent({ '.tooltip-inner': tooltipText });
			}
		});
	}

	function initializeSessionStateNotice() {
		const urlParams = new URLSearchParams(window.location.search);
		if (urlParams.get('expirado') === '1') {
			showModalMessage('Tu sesión ha expirado por inactividad. Por favor, inicia sesión nuevamente.', 'error');
		}
	}

	function initializeFormSubmission() {
		if (!form) {
			return;
		}

		form.addEventListener('submit', function (event) {
			event.preventDefault();

			if (indicatorLabel && indicatorProgress) {
				indicatorLabel.classList.add('d-none');
				indicatorProgress.classList.remove('d-none');
			}

			// Crear FormData e incluir explícitamente rememberMe
			const formData = new FormData(form);
			if (rememberMeCheckbox && rememberMeCheckbox.checked) {
				formData.set('rememberMe', 'true');
			} else {
				formData.delete('rememberMe');
			}

			fetch(form.action, {
				method: 'POST',
				body: formData,
				headers: {
					Accept: 'application/json'
				},
				credentials: 'include' // Importante: incluir cookies HttpOnly
			})
				.then(response => response.json())
				.then(data => {
					showModalMessage(data.message, data.icon);

					if (data.success && data.redirect) {
						saveCredentials();
						saveLastCountry();
						setTimeout(function () {
							window.location.href = data.redirect;
						}, 2000);
					}
				})
				.catch(function () {
					showModalMessage('Error en la conexión con el servidor', 'error');
				})
				.finally(function () {
					if (indicatorLabel && indicatorProgress) {
						indicatorLabel.classList.remove('d-none');
						indicatorProgress.classList.add('d-none');
					}
				});
		});
	}

	function initializeCatalog() {
		if (!countrySelect || !companyCodeInput) {
			return;
		}

		setSelectorsDisabled(true);
		loadCatalog()
			.then(records => {
				buildCatalog(records);
				populateCountryOptions();
				attachCatalogListeners();
				setSelectorsDisabled(false);
				loadLastCountry();
			})
			.catch(error => {
				const message = error instanceof Error ? error.message : 'No fue posible cargar los países.';
				presentCatalogError(message);
				showModalMessage(message, 'error');
			});
	}

	function loadCatalog() {
		return fetch('http://192.168.10.81:8022/api/Country/GetByCompany', {
			method: 'GET',
			headers: {
				Accept: 'application/json'
			}
		})
			.then(response => {
				if (!response.ok) {
					throw new Error('No se pudo obtener el catálogo de países.');
				}
				return response.json();
			})
			.then(payload => {
				if (!payload || payload.statusResult === false) {
					throw new Error(payload?.messageResult || 'No se obtuvo una respuesta válida del servidor.');
				}

				let data = payload.dataResult || [];
				if (!Array.isArray(data)) {
					data = data ? [data] : [];
				}

				if (!data.length) {
					throw new Error('No hay países configurados para iniciar sesión.');
				}

				return data.map(normalizeRecord);
			});
	}

	function normalizeRecord(item) {
		const countryId = (item.countryId || '').trim().toUpperCase();

		return {
			countryId,
			countryName: formatCountryName(item.name || countryId),
			sapCode: item.sapCode || ''
		};
	}

	function formatCountryName(value) {
		return value.replace(/\w\S*/g, function (text) {
			return text.charAt(0).toUpperCase() + text.slice(1).toLowerCase();
		});
	}

	function buildCatalog(records) {
		// Solo guardar países de Pipsa (PI)
		countryList = records
			.filter(record => record.countryId) // Solo países válidos
			.sort((a, b) => a.countryName.localeCompare(b.countryName, 'es'));
	}

	function populateCountryOptions() {
		if (!countryList.length) {
			countrySelect.innerHTML = '<option value="" disabled selected>No hay países disponibles</option>';
			countrySelect.disabled = true;
			companyCodeInput.value = '';
			return;
		}

		countrySelect.disabled = false;
		countrySelect.innerHTML = '';

		countryList.forEach(country => {
			const option = document.createElement('option');
			option.value = country.countryId;
			option.textContent = country.countryName;
			option.dataset.sapCode = country.sapCode;
			countrySelect.appendChild(option);
		});

		// Seleccionar el primer país por defecto
		if (countryList.length > 0) {
			countrySelect.value = countryList[0].countryId;
			applySelectedCountry();
		}
	}

	function attachCatalogListeners() {
		countrySelect.addEventListener('change', function () {
			applySelectedCountry();
		});
	}

	function applySelectedCountry() {
		const selected = countrySelect.options[countrySelect.selectedIndex];
		if (!selected) {
			companyCodeInput.value = '';
			return;
		}

		companyCodeInput.value = selected.dataset.sapCode || '';
	}

	function buildModal() {
		const modalElement = document.getElementById('kt_modal_messages');
		return modalElement ? new bootstrap.Modal(modalElement) : null;
	}

	function showModalMessage(message, iconType) {
		const modal = buildModal();
		if (!modal) {
			return;
		}

		const iconElement = document.getElementById('kt_modal_messages_icon');
		const textElement = document.getElementById('kt_modal_messages_text');

		if (iconElement) {
			iconElement.innerHTML = iconType === 'success' ? renderSuccessIcon() : renderErrorIcon();
		}

		if (textElement) {
			textElement.textContent = message;
		}

		modal.show();
	}

		return `
			<span class="svg-icon svg-icon-5tx svg-icon-success mb-5">
				<svg width="100" height="100" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path opacity="0.3" d="M20.5543 4.37824L12.1798 2.02473C12.0626 1.99176 11.9376 1.99176 11.8203 2.02473L3.44572 4.37824C3.18118 4.45258 3 4.6807 3 4.93945V13.569C3 14.6914 3.48509 15.8404 4.4417 16.984C5.17231 17.8575 6.18314 18.7345 7.446 19.5909C9.56752 21.0295 11.6566 21.912 11.7445 21.9488C11.8258 21.9829 11.9129 22 12.0001 22C12.0872 22 12.1744 21.983 12.2557 21.9488C12.3435 21.912 14.4326 21.0295 16.5541 19.5909C17.8169 18.7345 18.8277 17.8575 19.5584 16.984C20.515 15.8404 21 14.6914 21 13.569V4.93945C21 4.6807 20.8189 4.45258 20.5543 4.37824Z" fill="currentColor"/>
					<path d="M10.5606 11.3042L9.57283 10.3018C9.28174 10.0065 8.80522 10.0065 8.51412 10.3018C8.22897 10.5912 8.22897 11.0559 8.51412 11.3452L10.4182 13.2773C10.8099 13.6747 11.451 13.6747 11.8427 13.2773L15.4859 9.58051C15.771 9.29117 15.771 8.82648 15.4859 8.53714C15.1948 8.24176 14.7183 8.24176 14.4272 8.53714L11.7002 11.3042C11.3869 11.6221 10.874 11.6221 10.5606 11.3042Z" fill="currentColor"/>
				</svg>
			</span>`;
	}

	function renderErrorIcon() {
		return `
			<span class="svg-icon svg-icon-5tx svg-icon-danger mb-5">

	function presentCatalogError(message) {
		countrySelect.innerHTML = `<option value="" disabled selected>${escapeHtml(message)}</option>`;
		countrySelect.disabled = true;
		companyCodeInput.value = '';
	}

	function setSelectorsDisabled(isDisabled) {
		if (countrySelect) {
			countrySelect.disabled = isDisabled;
		}
	}

	function escapeHtml(value) {
		return (value || '').replace(/[&<>"']/g, function (match) {
			switch (match) {
				case '&':
					return '&amp;';
				case '<':
					return '&lt;';
				case '>':
					return '&gt;';
				case '"':
					return '&quot;';
				case "'":
					return '&#39;';
				default:
					return match;
			}
		});
	}
